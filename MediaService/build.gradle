plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'idea'
	id("com.google.protobuf") version "0.9.5"
}

group = 'me.elpomoika'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "2.0.0")
}

dependencies {
	implementation 'ru.homyakin:iuliia-java:2.0.0'
	implementation 'io.github.cdimascio:dotenv-java:3.2.0'

	// spring stuff
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation:4.1.0-M3'

	// jwt
	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

	implementation 'org.springframework.boot:spring-boot-starter-security'

	testImplementation 'org.springframework.security:spring-security-test'

	// database
	implementation 'org.hibernate.search:hibernate-search-backend-lucene:8.3.0.Final'
	implementation 'org.hibernate.search:hibernate-search-mapper-orm:8.3.0.Final'
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'software.amazon.awssdk:s3:2.42.17'

	implementation 'org.springframework.grpc:spring-grpc-spring-boot-starter:0.8.0'
	implementation 'io.grpc:grpc-services:1.72.0'


	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

protobuf {
	protoc {
		artifact = "com.google.protobuf:protoc:4.31.1"
	}

	plugins {
		grpc {
			artifact = "io.grpc:protoc-gen-grpc-java:1.72.0"
		}
	}

	generateProtoTasks {
		all().each { task ->
			task.plugins {
				grpc {}
			}
		}
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
